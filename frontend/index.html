<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agent Spend-Policy Check API</title>
    <script>
      // Sets the `dark` class before first paint, so the page never flashes
      // light before switching. Keep this inline and above the stylesheet.
      // Defaults to dark unless the visitor has explicitly chosen light.
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var dark = stored !== "light";
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
